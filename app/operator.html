<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>No Fries | Work</title>
    <meta name="description" content="Private No Fries customer workflow, exception, approval and activity console.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/operator.css">
    <script src="/js/operator-loader.js" defer></script>
</head>
<body data-page="operator" class="operator-loading">
    <a class="skip-link" href="#operatorMain">Skip to work requiring attention</a>
    <header class="operator-header">
        <a class="operator-brand" href="/operator" aria-label="No Fries staff workspace">
            <img src="/images/nofrieslogo.png" width="46" height="46" alt="No Fries logo">
            <span><strong>No Fries</strong><small>Work</small></span>
        </a>
        <nav aria-label="Private workspace navigation">
            <a href="/operator" aria-current="page">Work</a>
            <a href="/scoping">Sales</a>
            <a href="/support">Service desk</a>
            <a id="dashboardAdminNavigation" href="/dashboard-admin/entry" hidden>Dashboard administration</a>
            <form class="sign-out-form" action="/api/auth/logout" method="post">
                <input type="hidden" name="returnTo" value="/">
                <button class="sign-out-button" type="submit">Sign out</button>
            </form>
        </nav>
    </header>

    <main id="operatorMain">
        <section class="operator-loading-panel" id="loadingPanel" aria-live="polite">
            <p class="eyebrow">Protected workspace</p>
            <h1>Loading work that needs attention</h1>
            <p id="loadingStatus">Checking your Microsoft identity, tenant and role.</p>
        </section>
        <div id="operatorRoot" hidden></div>
    </main>
    <div class="operator-toast" id="operatorToast" role="status" aria-live="polite" hidden></div>
</body>
</html>
