name: Public application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The Jest suite is split into parallel shards; each shard still runs its
    # files serially (--runInBand), exactly as the previous single job did.
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - run: npm ci --ignore-scripts --omit=optional --audit=false
      - run: npx jest --runInBand --shard=${{ matrix.shard }}/4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      PROMPTFOO_DISABLE_SHARE_EMAIL_REQUEST: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - name: Verify pinned local dependencies
        run: |
          node --test scripts/tests/check-public-tree.cjs
          node scripts/check-public-tree.js
          node scripts/verify-adm-zip-memory-only.js
          node vendor/node-forge-rsa-validated/build-package.js --check
      - run: npm ci --ignore-scripts --omit=optional --audit=false
      # Everything `npm run verify` runs after the Jest suite.
      - run: npm run eval:prospect
      - run: npm run build
      - run: npm run check:syntax
      - run: npm run eval:prospect:promptfoo
        env:
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/promptfoo
      - name: Build runtime package and verify install closure
        run: |
          npm run build:app-service
          cd app-service-dist
          npm ci --ignore-scripts --omit=dev --omit=optional --dry-run --offline --audit=false

  application:
    # Required check. Passes only if every unit shard and the build job succeeded;
    # a skipped, cancelled or failed dependency fails this gate.
    if: always()
    needs: [unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all application jobs to succeed
        env:
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "unit=$UNIT build=$BUILD"
          test "$UNIT" = success && test "$BUILD" = success

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_DB: nofries_ci
          POSTGRES_USER: nofries_ci_owner
          POSTGRES_PASSWORD: nofries-ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready --username=nofries_ci_owner --dbname=nofries_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - run: npm ci --ignore-scripts --omit=optional --audit=false
      - name: Apply migrations twice and run native tenant-isolation tests
        env:
          NOFRIES_DATABASE_URL: postgresql://nofries_ci_owner:nofries-ci-only-password@127.0.0.1:5432/nofries_ci
          NOFRIES_TEST_DATABASE_URL: postgresql://nofries_ci_owner:nofries-ci-only-password@127.0.0.1:5432/nofries_ci
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run test:postgres

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - name: Audit both governed closures with the unchanged exact temporary disposition
        shell: bash
        run: |
          set -euo pipefail
          audit_report() {
            local report="$1"; shift
            local status=0
            timeout 300s "$@" > "$report" || status=$?
            if [[ "$status" -gt 1 ]]; then exit "$status"; fi
            test -s "$report"
          }
          root_report="$RUNNER_TEMP/root-audit.json"
          api_report="$RUNNER_TEMP/api-audit.json"
          audit_report "$root_report" npm audit --package-lock-only --json --audit-level=low
          audit_report "$api_report" npm --prefix api audit --package-lock-only --omit=dev --json --audit-level=low
          node scripts/check-dependency-audit.js --dependency-changed --connector-dependency-changed --root-report "$root_report" --api-report "$api_report"
