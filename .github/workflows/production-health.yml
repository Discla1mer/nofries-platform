name: Read-only production health

on:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'Discla1mer/nofries-platform' && vars.NOFRIES_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - name: Check public routes and certificate; alert on failure
        env:
          NOFRIES_MONITOR_ENABLED: ${{ vars.NOFRIES_MONITOR_ENABLED }}
          NOFRIES_MONITOR_ALERT_WEBHOOK: ${{ secrets.NOFRIES_MONITOR_ALERT_WEBHOOK }}
        run: node scripts/production-health-monitor.js
